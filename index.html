<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>VEC.VirtualMarketplace</title>
<style>
    body { background:#111; color:#eee; font-family:Arial; padding:20px; }
    button { padding:10px 20px; margin:5px; background:#333; color:#fff; border:1px solid #555; }
    #log { margin-top:20px; padding:10px; background:#222; border:1px solid #444; }
</style>
</head>
<body>

<h1>VEC.VirtualMarketplace</h1>
<p>Interaktive Teststation für Marktlogik.</p>

<button onclick="control()">DOO/IT aktivieren</button>
<button onclick="passage()">DOOR öffnen</button>
<button onclick="trade()">Trade ausführen</button>

<div id="log">System bereit.</div>

<script>
function log(msg) {
    document.getElementById("log").innerHTML = msg;
}

function control() {
    log("DOO/IT aktiviert → Kontrolle bereit.");
}

function passage() {
    log("DOOR geöffnet → Übergang aktiv.");
}

function trade() {
    log("Trade ausgeführt → Bewertung durch GENIE.");
}
</script>

</body>
</html>
